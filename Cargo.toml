[workspace]
resolver = "3"
members = ["api", "client", "client-reqwest", "client-reqwless"]


[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/knobmote/sony-bravia-rs"
license = "MIT"


[workspace.dependencies]
embassy-futures = { version = "0.1", default-features = false }
embedded-io-async = { version = "0.7", default-features = false }
reqwest = { version = "0.13", default-features = false }
reqwless = { version = "0.14", default-features = false }
serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1.54", default-features = false }

sony-bravia-api = { path = "./api", version = "0.1" }
sony-bravia-client = { path = "./client", version = "0.1" }


[workspace.lints.clippy]
use_self = "warn"
map_flatten = "warn"
map_unwrap_or = "warn"


[workspace.lints.rust]
deprecated_in_future = "warn"
future_incompatible = "warn"
noop_method_call = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_compatibility = "warn"
rust_2021_compatibility = "warn"
rust_2018_idioms = "warn"
trivial_casts = "warn"
unused = "warn"
# warnings = "deny"
